<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="420" height="150" viewBox="0 0 420 150" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#eef2f6; }
      .ColorScheme-Background { color:#12161c; }
      .ColorScheme-Highlight { color:#7aafcc; }
      .ColorScheme-ViewText { color:#eef2f6; }
      .ColorScheme-ViewBackground { color:#12161c; }
      .ColorScheme-ButtonText { color:#eef2f6; }
      .ColorScheme-ButtonBackground { color:#1a2028; }
    </style>

    <!-- Linear shadows: fade completely to 0 BEFORE outer edge (at 85%) so no hard box ever appears -->
    <linearGradient id="sh-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-left" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial shadows centered at the inner corner circle center (radius R=16..SC=28) -->
    <radialGradient id="sh-tl" gradientUnits="userSpaceOnUse" cx="308" cy="58" r="28">
      <stop offset="57.1%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="74.3%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-tr" gradientUnits="userSpaceOnUse" cx="340" cy="58" r="28">
      <stop offset="57.1%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="74.3%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-bl" gradientUnits="userSpaceOnUse" cx="308" cy="90" r="28">
      <stop offset="57.1%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="74.3%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-br" gradientUnits="userSpaceOnUse" cx="340" cy="90" r="28">
      <stop offset="57.1%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="74.3%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="hint-tile-center" x="0" y="0" width="5" height="5" fill="#ff6600"/>

  <!-- MAIN 9-SLICE GLASS PANEL (16px SMOOTH CORNERS + 1px GLASS HAIRLINE) -->
  <rect id="center" x="46" y="46" width="32" height="32"
        class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>

  <g id="top">
    <rect x="46" y="30" width="32" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <rect x="46" y="30" width="32" height="1" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <g id="bottom">
    <rect x="46" y="78" width="32" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <rect x="46" y="93" width="32" height="1" fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <g id="left">
    <rect x="30" y="46" width="16" height="32"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <rect x="30" y="46" width="1" height="32" fill="#ffffff" fill-opacity="0.13"/>
  </g>

  <g id="right">
    <rect x="78" y="46" width="16" height="32"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <rect x="93" y="46" width="1" height="32" fill="#ffffff" fill-opacity="0.13"/>
  </g>

  <g id="topleft">
    <path d="M 46,30 L 46,46 L 30,46 A 16,16 0 0 1 46,30 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <path d="M 46,30 A 16,16 0 0 0 30,46 L 31,46 A 15,15 0 0 1 46,31 Z"
          fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <g id="topright">
    <path d="M 78,30 A 16,16 0 0 1 94,46 L 78,46 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <path d="M 78,30 A 16,16 0 0 1 94,46 L 93,46 A 15,15 0 0 0 78,31 Z"
          fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <g id="bottomleft">
    <path d="M 30,78 L 46,78 L 46,94 A 16,16 0 0 1 30,78 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <path d="M 30,78 A 16,16 0 0 0 46,94 L 46,93 A 15,15 0 0 1 31,78 Z"
          fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <g id="bottomright">
    <path d="M 78,78 L 94,78 A 16,16 0 0 1 78,94 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.86"/>
    <path d="M 94,78 A 16,16 0 0 1 78,94 L 78,93 A 15,15 0 0 0 93,78 Z"
          fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <!-- MARGIN HINTS -->
  <rect id="hint-top-margin" x="60" y="30" width="4" height="12" fill="#ff00ff"/>
  <rect id="hint-bottom-margin" x="60" y="82" width="4" height="12" fill="#ff00ff"/>
  <rect id="hint-left-margin" x="30" y="60" width="12" height="4" fill="#ff00ff"/>
  <rect id="hint-right-margin" x="82" y="60" width="12" height="4" fill="#ff00ff"/>

  <rect id="thick-center" x="10" y="120" width="16" height="16" class="ColorScheme-Background" fill="currentColor"/>
  <rect id="thick-hint-top-margin" x="30" y="120" width="4" height="6" fill="#800080"/>
  <rect id="thick-hint-bottom-margin" x="38" y="120" width="4" height="6" fill="#800080"/>
  <rect id="thick-hint-left-margin" x="46" y="120" width="10" height="4" fill="#800080"/>
  <rect id="thick-hint-right-margin" x="60" y="120" width="10" height="4" fill="#800080"/>

  <!-- MASK 9-SLICE (EXACT 16PX CORNERS FOR BLUR/CLIP) -->
  <rect id="mask-center" x="166" y="46" width="32" height="32" fill="#000000"/>
  <rect id="mask-top" x="166" y="30" width="32" height="16" fill="#000000"/>
  <rect id="mask-bottom" x="166" y="78" width="32" height="16" fill="#000000"/>
  <rect id="mask-left" x="150" y="46" width="16" height="32" fill="#000000"/>
  <rect id="mask-right" x="198" y="46" width="16" height="32" fill="#000000"/>
  <path id="mask-topleft" d="M 166,30 L 166,46 L 150,46 A 16,16 0 0 1 166,30 Z" fill="#000000"/>
  <path id="mask-topright" d="M 198,30 A 16,16 0 0 1 214,46 L 198,46 Z" fill="#000000"/>
  <path id="mask-bottomleft" d="M 150,78 L 166,78 L 166,94 A 16,16 0 0 1 150,78 Z" fill="#000000"/>
  <path id="mask-bottomright" d="M 198,78 L 214,78 A 16,16 0 0 1 198,94 Z" fill="#000000"/>

  <!-- SHADOW 9-SLICE (CUTOUT MATCHES EXACT 16PX ROUNDED CORNERS — ZERO BOXY OVERLAP) -->
  <rect id="shadow-center" x="308" y="58" width="32" height="32" fill="#000000" fill-opacity="0"/>
  <g id="shadow-top">
    <rect x="308" y="30" width="32" height="28" fill="none"/>
    <rect x="308" y="30" width="32" height="12" fill="url(#sh-top)"/>
  </g>
  <g id="shadow-bottom">
    <rect x="308" y="90" width="32" height="28" fill="none"/>
    <rect x="308" y="106" width="32" height="12" fill="url(#sh-bottom)"/>
  </g>
  <g id="shadow-left">
    <rect x="280" y="58" width="28" height="32" fill="none"/>
    <rect x="280" y="58" width="12" height="32" fill="url(#sh-left)"/>
  </g>
  <g id="shadow-right">
    <rect x="340" y="58" width="28" height="32" fill="none"/>
    <rect x="356" y="58" width="12" height="32" fill="url(#sh-right)"/>
  </g>

  <!-- Corner shadows: ONLY draw the ring outside radius R=16 (cut out the rounded panel corner!) -->
  <g id="shadow-topleft">
    <rect x="280" y="30" width="28" height="28" fill="none"/>
    <path d="M 280,30 L 308,30 L 308,42 A 16,16 0 0 0 292,58 L 280,58 Z" fill="url(#sh-tl)"/>
  </g>
  <g id="shadow-topright">
    <rect x="340" y="30" width="28" height="28" fill="none"/>
    <path d="M 340,30 L 368,30 L 368,58 L 356,58 A 16,16 0 0 0 340,42 Z" fill="url(#sh-tr)"/>
  </g>
  <g id="shadow-bottomleft">
    <rect x="280" y="90" width="28" height="28" fill="none"/>
    <path d="M 280,90 L 292,90 A 16,16 0 0 0 308,106 L 308,118 L 280,118 Z" fill="url(#sh-bl)"/>
  </g>
  <g id="shadow-bottomright">
    <rect x="340" y="90" width="28" height="28" fill="none"/>
    <path d="M 356,90 L 368,90 L 368,118 L 340,118 L 340,106 A 16,16 0 0 0 356,90 Z" fill="url(#sh-br)"/>
  </g>

  <rect id="shadow-hint-top-margin" x="318" y="30" width="4" height="12" fill="#ff6600"/>
  <rect id="shadow-hint-top-inset" x="324" y="30" width="4" height="12" fill="#ff5555"/>
  <rect id="shadow-hint-bottom-margin" x="318" y="106" width="4" height="12" fill="#ff6600"/>
  <rect id="shadow-hint-bottom-inset" x="324" y="106" width="4" height="12" fill="#ff5555"/>
  <rect id="shadow-hint-left-margin" x="280" y="68" width="12" height="4" fill="#ff6600"/>
  <rect id="shadow-hint-left-inset" x="280" y="74" width="12" height="4" fill="#ff5555"/>
  <rect id="shadow-hint-right-margin" x="356" y="68" width="12" height="4" fill="#ff6600"/>
  <rect id="shadow-hint-right-inset" x="356" y="74" width="12" height="4" fill="#ff5555"/>
</svg>
